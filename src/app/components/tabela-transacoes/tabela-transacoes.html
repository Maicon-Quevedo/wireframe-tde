<div id = 'tabela'>
    <table class = 'table table-dark table-striped'>
        <thead>
            <tr>
                @for (item of coluna; track item){
                    <th>{{ item }}</th>
                }
            </tr>
        </thead>
        <tbody>
            @for (data of datas; track $index){
                <tr>
                    <td>{{ data }}</td>
                    <td>{{ tipos[$index] }}</td>
                    <td>{{ valores[$index] }}</td>
                </tr>
            }
        </tbody>
    </table>
</div>

<header>
  <app-header-wireframe [nome]='array'></app-header-wireframe>
</header>
<main>
  <div class = 'main'>
    <h1>T1 - Últimas Transações</h1>
    <p class = 'subtitulo'>Movimentações ordenadas da mais recente para a mais antiga</p>
    <h4 class = 'titulo-topico'>Últimas transações (30 registros - exibindo 10)</h4>
  </div>
  <app-tabela-transacoes 
    [coluna]='colunas_transacoes'
    [datas]='datas_transacoes'
    [tipos]='tipo_transacoes'
    [valores]='valor_transacoes'>
  </app-tabela-transacoes>
</main>
<footer>
  <app-footer-wireframe [frase_footer]='frase_footer' class='footer'></app-footer-wireframe>
</footer>
